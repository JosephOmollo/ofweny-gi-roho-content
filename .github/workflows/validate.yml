# .github/workflows/validate.yml
name: Validate Songs

on:
  pull_request:
    paths:
      - 'songs/**/*.json'
      - 'schemas/**/*.json'
      - 'scripts/validate-songs.mjs'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Validate song JSON and ChordPro
        run: node scripts/validate-songs.mjs